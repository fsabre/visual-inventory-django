services:
  backend:
    build: src
    environment:
     - "APP_HOST=$HOST"
     - "SECRET_KEY=$DJANGO_SECRET_KEY"
     - "DEBUG=$DJANGO_DEBUG"
    volumes:
     - "db_data:/app/src/db.sqlite3"
     - "staticfiles:/staticfiles"
  
  frontend:
    image: "caddy:2.11.9-alpine"
    restart: unless-stopped
    environment:
      - "APP_HOST=$HOST"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "staticfiles:/var/www/static:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    ports:
     - "8000:8000"

volumes:
  db_data:
  caddy_data:
  caddy_config:
  staticfiles:
